name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q safetube-source.zip -d src
      - name: Tiro Bangla ফন্ট নামানো
        run: |
          F=src/SafeTube/app/src/main/assets/fonts/TiroBangla-Regular.ttf
          curl -fsSL -o "$F" https://raw.githubusercontent.com/google/fonts/main/ofl/tirobangla/TiroBangla-Regular.ttf \
            || curl -fsSL -o "$F" https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/tirobangla/TiroBangla-Regular.ttf \
            || echo "ফন্ট নামানো যায়নি, সাধারণ ফন্টে চলবে"
          if [ -f "$F" ] && [ "$(stat -c%s "$F")" -lt 20000 ]; then rm -f "$F"; fi
          ls -l src/SafeTube/app/src/main/assets/fonts/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug --stacktrace
        working-directory: src/SafeTube
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Safe Tube
          prerelease: true
          files: src/SafeTube/app/build/outputs/apk/debug/app-debug.apk
